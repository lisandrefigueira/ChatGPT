services:
  lingua:
    build: .
    container_name: lingua
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST:-./google-credentials.json}:/app/google-credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/google-credentials.json
